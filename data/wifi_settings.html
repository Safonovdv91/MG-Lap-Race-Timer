<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки Wi-Fi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input[readonly] {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
        .password-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .password-section h3 {
            margin-top: 0;
            color: #333;
        }
        .error-message {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        .success-message {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .button-group button {
            flex: 1;
        }
        .btn-cancel {
            background: #9e9e9e;
        }
        .btn-cancel:hover {
            background: #757575;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Настройки Wi-Fi</h2>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <form id="wifi-form">
            <!-- Текущий SSID (только для просмотра) -->
            <div class="form-group">
                <label for="current-ssid">SSID точки доступа:</label>
                <input type="text" id="current-ssid" value="SFMTimer" readonly>
                <small style="color: #666;">SSID нельзя изменить</small>
            </div>
            
            <!-- Текущий пароль (только для просмотра) -->
            <div class="form-group">
                <label for="current-password-display">Текущий пароль:</label>
                <input type="text" id="current-password-display" value="123456789" readonly>
            </div>
            
            <!-- Секция смены пароля -->
            <div class="password-section">
                <h3>Смена пароля</h3>
                
                <div class="form-group">
                    <label for="old-password-1">Введите текущий пароль (1):</label>
                    <input type="password" id="old-password-1" placeholder="Текущий пароль" required>
                </div>
                
                <div class="form-group">
                    <label for="old-password-2">Введите текущий пароль (2):</label>
                    <input type="password" id="old-password-2" placeholder="Подтвердите текущий пароль" required>
                </div>
                
                <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
                
                <div class="form-group">
                    <label for="new-password-1">Новый пароль (1):</label>
                    <input type="password" id="new-password-1" placeholder="Новый пароль" minlength="8" maxlength="64" required>
                    <small style="color: #666;">Минимум 8 символов</small>
                </div>
                
                <div class="form-group">
                    <label for="new-password-2">Новый пароль (2):</label>
                    <input type="password" id="new-password-2" placeholder="Подтвердите новый пароль" minlength="8" maxlength="64" required>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Сохранить</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='/'">Отмена</button>
            </div>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="/">← На главную</a>
        </div>
    </div>
    
    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загрузка текущих настроек
            loadCurrentSettings();
            
            // Обработчик отправки формы
            document.getElementById('wifi-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveNewPassword();
            });
        });
        
        function loadCurrentSettings() {
            fetch('/api/v1/wifi/settings')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('current-ssid').value = data.ssid || 'SFMTimer';
                    document.getElementById('current-password-display').value = data.password || '********';
                })
                .catch(err => console.error('Error loading settings:', err));
        }
        
        function saveNewPassword() {
            const oldPass1 = document.getElementById('old-password-1').value;
            const oldPass2 = document.getElementById('old-password-2').value;
            const newPass1 = document.getElementById('new-password-1').value;
            const newPass2 = document.getElementById('new-password-2').value;
            
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            // Сброс сообщений
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Валидация: текущие пароли должны совпадать
            if (oldPass1 !== oldPass2) {
                showError('Текущие пароли не совпадают!');
                return;
            }
            
            // Валидация: новые пароли должны совпадать
            if (newPass1 !== newPass2) {
                showError('Новые пароли не совпадают!');
                return;
            }
            
            // Валидация: длина нового пароля
            if (newPass1.length < 8) {
                showError('Новый пароль должен быть не менее 8 символов!');
                return;
            }
            
            // Валидация: новый пароль не должен совпадать со старым
            if (oldPass1 === newPass1) {
                showError('Новый пароль должен отличаться от текущего!');
                return;
            }
            
            // Отправка данных на сервер
            fetch('/api/v1/wifi/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    oldPassword: oldPass1,
                    newPassword: newPass1
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccess('Пароль успешно изменён! Перезагрузка...');
                    // Очистка полей
                    document.getElementById('old-password-1').value = '';
                    document.getElementById('old-password-2').value = '';
                    document.getElementById('new-password-1').value = '';
                    document.getElementById('new-password-2').value = '';
                    
                    // Обновление отображения текущего пароля
                    document.getElementById('current-password-display').value = newPass1;
                    
                    // Перезагрузка через 3 секунды
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    showError(data.message || 'Ошибка при смене пароля');
                }
            })
            .catch(err => {
                showError('Ошибка соединения: ' + err.message);
            });
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>
</html>
