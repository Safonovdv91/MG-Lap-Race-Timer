<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SFMgTimer</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <div class="battery-status" id="battery-status">
            <!-- Обновляется через WebSocket -->
            <span class="battery-info rx">RX: --%</span>
            <span class="battery-info tx">TX: --%</span>
        </div>
        <div class="mode-selector-container">
            <select id="mode-select" onchange="changeMode(this.value)">
                <option value="0">Lap Timer</option>
                <option value="1">Race Timer</option>
            </select>
        </div>
    </div>

    <div class="timer-container">
        <div id="timer-status"></div>
        <h1 class="timer-display" id="timer-display">00:00.000</h1>
        <p class="timer-subtitle" id="timer-subtitle">ready to go</p>
    </div>

    <div class="controls">
        <button class="button" onclick="resetMeasurements()">Reset</button>
    </div>

    <div class="history">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Lap</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>

    <div class="footer">
        <a href="/wifisettings">Wi-Fi Settings</a>
    </div>

    <script src="/script.js"></script>
</body>
</html>
