; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Receiver-RX-debug]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = 
  -DRECEIVER_MODE
  -DCORE_DEBUG_LEVEL=3
debug_tool = esp-prog
debug_init_break = tbreak setup
debug_port = :3333
lib_deps =
   bblanchon/ArduinoJson@^6.18.3
   links2004/WebSockets@^2.4.1
build_src_filter = +<receiver_main.cpp> +<web_handlers.cpp> +<web_content.cpp> +<measurements_side_effects.cpp> +<websocket_handlers.cpp> +<config.cpp> +<core/> +<battery/> -<.git/> -<.svn/> -<examples/> -<tests/>


[env:Transmitter-TX]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -DTRANSMITTER_MODE
lib_deps =
  bblanchon/ArduinoJson@^6.18.3
  links2004/WebSockets@^2.4.1
build_src_filter = +<transmitter_main.cpp> +<ir_transmitter.cpp> +<config.cpp> +<core/> +<battery/>  -<.git/> -<.svn/> -<examples/> -<tests/>

[env:Receiver-RX]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DRECEIVER_MODE
lib_deps =
  bblanchon/ArduinoJson@^6.18.3
  links2004/WebSockets@^2.4.1
build_src_filter = +<receiver_main.cpp> +<web_handlers.cpp> +<web_content.cpp> +<measurements_side_effects.cpp> +<websocket_handlers.cpp> +<config.cpp> +<core/> +<battery/> -<.git/> -<.svn/> -<examples/> -<tests/>

